# The shell's JVM tests, lint and a build of the library, on every push and pull request. No secret is used or needed.
name: android
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon :shell:testDebugUnitTest :shell:lintDebug :shell:assembleRelease
