# The shell's JVM tests, lint and a build of the library, on every push and pull request. No secret is used or needed.
# The runner's own Android SDK serves (ANDROID_HOME); the Android Gradle plugin fetches the platform it compiles with.
name: android
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew --no-daemon :shell:testDebugUnitTest :shell:lintDebug :shell:assembleRelease
